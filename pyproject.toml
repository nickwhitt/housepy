[project]
name = "housepy"
version = "0.1.0"
description = "Genealogy and peerage tracking for European nobility, built on FastAPI + NetworkX"
authors = [
    {name = "Nick Whitt",email = "nick.whitt@pm.me"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,!=3.14.1"
dependencies = [
    "networkx (>=3.6.1,<4.0.0)",
    "pyvis (>=0.3.2,<0.4.0)",
    "fastapi[standard] (>=0.140.13,<0.141.0)",
    "pydantic (>=2.13,<3.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)"
]

[dependency-groups]
dev = [
    "devtools (>=0.12.2,<0.13.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "freezegun (>=1.5.5,<2.0.0)",
    "httpx2 (>=2.9.1,<3.0.0)",
    "ruff (>=0.16.0,<0.17.0)"
]

[tool.fastapi]
entrypoint = "housepy.main:app"

[tool.poetry]
packages = [{include = "housepy", from = "src"}]
include = ["src/housepy/db/seed.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B"        # flake8-bugbear
]

# B008 (function call in argument default) is meant to catch accidental mutable
# defaults, but its heuristic for recognizing idiomatic FastAPI route signatures
# breaks once a `Depends(...)`-typed parameter's annotation isn't a type ruff
# already knows (e.g. `sqlalchemy.orm.Session`) — it then flags the `Depends`
# call itself, which is the correct, intended FastAPI pattern. Exempt it
# explicitly rather than working around ruff's detection.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
