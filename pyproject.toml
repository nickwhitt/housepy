[project]
name = "housepy"
version = "1.1.3"
description = "Genealogy and peerage tracking for European nobility, built on FastAPI + NetworkX"
authors = [
    {name = "Nick Whitt",email = "nick.whitt@pm.me"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14,!=3.14.1"
dependencies = [
    "networkx (>=3.6.1,<4.0.0)",
    "pyvis (>=0.3.2,<0.4.0)",
    "fastapi[standard] (>=0.140.13,<0.141.0)",
    "pydantic (>=2.13,<3.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)"
]

[dependency-groups]
dev = [
    "devtools (>=0.12.2,<0.13.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "freezegun (>=1.5.5,<2.0.0)",
    "httpx2 (>=2.9.1,<3.0.0)",
    "ruff (>=0.16.0,<0.17.0)",
    "pyright (>=1.1.411,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.fastapi]
entrypoint = "housepy.main:app"

[tool.poetry]
packages = [{include = "housepy", from = "src"}]
include = ["src/housepy/db/seed.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "scripts", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B"        # flake8-bugbear
]

# Exempts fastapi.Depends from B008: ruff's heuristic for idiomatic FastAPI
# signatures misses Depends(...) params typed with non-builtin classes (e.g.
# sqlalchemy.orm.Session).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
